[tool.ruff]
target-version = "py39"
line-length = 110
[tool.ruff.lint]
# Historical code uses compact formatting. Check name resolution, parser errors and imports.
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pytest injects registered fixtures by parameter name, including fixtures
# imported from other test modules.
"**/tests/test_*.py" = ["F811"]
# These exact files are part of published source identities. Historical imports
# are retained byte-for-byte so reopening an evaluation gives the same policy.
"training/brass_rl/agent.py" = ["F401"]
"training/brass_rl/policy_io.py" = ["F401"]
"training/brass_rl/artifacts.py" = ["F401"]
"engine/tools/brass_ai/replay_archive.py" = ["F401"]
