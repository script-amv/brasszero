name: Site
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PUBLIC_LAUNCHED: ${{ vars.PUBLIC_LAUNCHED || 'false' }}
  SITE_URL: ${{ vars.SITE_URL }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install PyYAML==6.0.3
      - run: npm --prefix site ci
      - run: make test-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Check Pages configuration
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$TOKEN" && -n "$ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages credentials are absent. The build artifact remains available."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.configured.outputs.ready == 'true'
        with:
          name: site-dist
          path: dist
      - name: Deploy the built artifact
        if: steps.configured.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brasszero --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
