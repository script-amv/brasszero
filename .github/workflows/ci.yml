name: Public checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  OMP_NUM_THREADS: '1'
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: make test-rust
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: python3 scripts/check_binding_audit.py
      - run: cargo deny check advisories licenses
  fresh-core:
    # ubuntu-latest (26.04) ships no Python 3.9 build; 24.04 does.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: test ! -e gui && test ! -e lab && test ! -e training/runs && test ! -e players/models && test ! -e engine/oracles/vendor
      - run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python ./engine/bindings pytest trueskill mpmath six ruff pip-licenses PyYAML==6.0.3
      - run: make test-py lint-python check-public
      - run: .venv/bin/pip-licenses --format=markdown
  training-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: make setup-training test-training
