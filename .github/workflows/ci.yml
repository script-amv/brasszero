name: Public checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
  OMP_NUM_THREADS: '1'
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: make test-rust
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: python3 scripts/check_binding_audit.py
      - run: cargo deny check advisories licenses
  fresh-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: test ! -e gui && test ! -e lab && test ! -e training/runs && test ! -e players/models && test ! -e engine/oracles/vendor
      - run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python ./engine/bindings pytest trueskill mpmath six ruff pip-licenses PyYAML==6.0.3
      - run: make test-py lint-python check-public
      - run: .venv/bin/pip-licenses --format=markdown
  training-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: make setup-training test-training
