name: Versioned release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo build --workspace --release --locked
      - name: Extract the version's changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "${TAG#v}" --notes > "$RUNNER_TEMP/release-notes.md"
      - name: Publish the tagged source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "BrassZero $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
