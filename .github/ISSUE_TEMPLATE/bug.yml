name: Reproducible bug
description: Report a discrepancy in rules, tooling or published results.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a version, command and a minimal non-private input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
