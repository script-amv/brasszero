[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "brass-rl"
version = "0.1.0"
description = "Optional PPO self-play runtime for Brass: Birmingham"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
macos-py39 = ["torch==2.2.2", "numpy==2.2.6"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brass_rl*"]
