version = 1

# The engine compatibility identity includes these exact bytes in every saved
# policy and recording. Attach licensing metadata alongside the originals.
[[annotations]]
path = ["Cargo.lock", "engine/core/Cargo.toml", "engine/core/src/**/*.rs", "engine/core/src/*.rs", "engine/bindings/tests/fixtures/components.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "BrassZero contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["engine/tools/tests/fixtures/strategy/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "BrassZero contributors"
SPDX-License-Identifier = "CC-BY-4.0"

