[package]
name = "brass_engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rand = "0.10.3"
rand_pcg = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Read by the `brass-diff` harness (oracles/known_differences.toml).
toml = "1.2.1"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[lints.cargo]
# rand, rand_pcg and serde_json are part of the planned crate setup but are first used by
# later tasks (game setup / serialization). Drop this allow once they are all used.
unused_dependencies = "allow"

[[bench]]
name = "random_games"
harness = false
